<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERZONER | Unified Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; --dim-neon: rgba(0, 255, 65, 0.2); }
        body { font-family: 'Fira Code', monospace; background-color: #050505; color: var(--neon); overflow-x: hidden; }
        .neon-border { border: 1px solid var(--neon); box-shadow: 0 0 10px var(--dim-neon); }
        .scanline { background: linear-gradient(to bottom, transparent 50%, rgba(0, 255, 65, 0.05) 50%); background-size: 100% 4px; }
        .typing-effect { overflow: hidden; white-space: nowrap; border-right: 2px solid var(--neon); animation: typing 1.5s steps(40, end), blink 0.8s infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }
        .traffic-bar { background: linear-gradient(to top, #003300, #00ff41); transition: height 0.3s ease; }
        .encrypted-text { filter: blur(3px); transition: filter 0.3s; }
        .encrypted-text:hover { filter: blur(0); }
    </style>
</head>
<body class="scanline min-h-screen">

    <div id="access-gate" class="fixed inset-0 z-50 flex items-center justify-center bg-black">
        <div class="text-center p-10 border-2 border-green-900 rounded-lg bg-black relative">
            <div class="w-24 h-24 mx-auto mb-6 border border-green-500 rounded-full flex items-center justify-center animate-pulse cursor-pointer" onclick="unlockSystem()">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 0112 3c1.268 0 2.39.234 3.468.657m-3.42 5.585l.06-.11m-2.106 2.106a8 8 0 0112.247-2.11m-9.414 5.522c1.829-1.285 3.731-2.457 5.705-3.51m-2.753-1.571a7.3 7.3 0 011.123 3.47M3.31 9a10.003 10.003 0 0115.444-1.123"></path></svg>
            </div>
            <p id="auth-status" class="text-xs tracking-widest uppercase">Waiting for Biometric...</p>
        </div>
    </div>

    <div id="main-ui" class="opacity-0 transition-opacity duration-1000 p-4">
        <header class="flex justify-between border-b border-green-900 pb-2 mb-6 uppercase text-sm font-bold">
            <div>[ CyberZoner // Node_01 ]</div>
            <div id="clock">00:00:00</div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <section class="md:col-span-3 space-y-4">
                <div id="terminal" class="neon-border h-96 bg-black p-4 overflow-y-auto text-xs space-y-1"></div>
                <div class="relative">
                    <span class="absolute left-3 top-3 opacity-50">></span>
                    <input type="text" id="cmd-input" class="w-full bg-black border border-green-900 p-3 pl-8 outline-none focus:border-green-400">
                </div>
            </section>

            <aside class="space-y-6">
                <div class="neon-border p-4">
                    <h3 class="text-xs mb-4 border-b border-green-900 pb-1 uppercase">Live Traffic</h3>
                    <div id="traffic-bars" class="flex items-end justify-between h-20 gap-1"></div>
                </div>
                <div class="neon-border p-4 bg-black">
                    <h3 class="text-xs mb-2 border-b border-green-900 pb-1 uppercase">System Stats</h3>
                    <div class="text-[10px] space-y-1">
                        <div class="flex justify-between"><span>CPU</span><span class="text-white">24%</span></div>
                        <div class="flex justify-between"><span>MEM</span><span class="text-white">1.2GB</span></div>
                    </div>
                </div>
                <button onclick="openDeploy()" class="w-full py-2 bg-green-900 text-black font-bold text-xs hover:bg-green-400 transition-all uppercase">Open Blueprint</button>
            </aside>
        </main>

        <section class="mt-8 neon-border relative h-48 overflow-hidden">
            <canvas id="matrix" class="absolute inset-0 opacity-10"></canvas>
            <div id="logs" class="relative z-10 p-4 text-[10px] space-y-1"></div>
        </section>
    </div>

    <div id="deploy-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-90">
        <div class="max-w-xl w-full p-6 border border-blue-500 bg-black bg-[radial-gradient(#1e3a8a_1px,transparent_1px)] bg-[size:20px_20px]">
            <h2 class="text-blue-400 mb-4 font-bold uppercase tracking-widest italic">Target_Deployment_Blueprint</h2>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <input type="text" placeholder="TARGET_IP" class="bg-transparent border border-blue-900 p-2 text-xs">
                <select class="bg-black border border-blue-900 p-2 text-xs"><option>RECON_AGENT</option><option>ENCRYPT_BOT</option></select>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeDeploy()" class="text-xs text-blue-900 uppercase">Abort</button>
                <button class="bg-blue-600 text-black px-4 py-1 text-xs font-bold" onclick="alert('Launching Payload...')">Initiate</button>
            </div>
        </div>
    </div>

    <script>
        // CORE LOGIC
        const UI = {
            log(msg, cls='text-green-300') {
                const term = document.getElementById('terminal');
                term.innerHTML += `<div class="${cls}"><span class="opacity-50">[SYS]</span> <span class="typing-effect">${msg}</span></div>`;
                term.scrollTop = term.scrollHeight;
            },
            vault(msg) {
                const logs = document.getElementById('logs');
                logs.innerHTML = `<div class="encrypted-text border-b border-green-950 pb-1 hover:text-white cursor-pointer">${new Date().toISOString()} - ${msg}</div>` + logs.innerHTML;
            }
        };

        // ACCESS LOGIC
        function unlockSystem() {
            document.getElementById('auth-status').innerText = "Access Granted.";
            setTimeout(() => {
                document.getElementById('access-gate').remove();
                document.getElementById('main-ui').classList.remove('opacity-0');
                UI.log("Neural interface established. Welcome, CyberZoner.");
                startMatrix();
                startTraffic();
            }, 1000);
        }

        // TRAFFIC SIMULATION
        function startTraffic() {
            const container = document.getElementById('traffic-bars');
            for(let i=0; i<12; i++) container.innerHTML += `<div class="traffic-bar w-full h-2"></div>`;
            setInterval(() => {
                document.querySelectorAll('.traffic-bar').forEach(b => b.style.height = Math.random()*100 + '%');
            }, 500);
        }

        // MATRIX EFFECT
        function startMatrix() {
            const c = document.getElementById('matrix'), ctx = c.getContext('2d');
            c.width = c.parentElement.offsetWidth; c.height = 200;
            const drops = Array(Math.floor(c.width/10)).fill(1);
            setInterval(() => {
                ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
                ctx.fillStyle = "#00ff41";
                drops.forEach((y, i) => {
                    ctx.fillText(String.fromCharCode(33 + Math.random()*94), i*10, y*10);
                    if(y*10 > c.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }, 500);
        }

        function openDeploy() { document.getElementById('deploy-modal').classList.remove('hidden'); }
        function closeDeploy() { document.getElementById('deploy-modal').classList.add('hidden'); }
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
        setInterval(() => UI.vault("Scanning network packet..."), 7000);
    </script>
</body>
</html>
